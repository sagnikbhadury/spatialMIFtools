on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::knitr, any::rmarkdown, any::geepack, any::reticulate
      - name: Install Python backend dependencies
        shell: bash
        run: |
          python -m pip install -r inst/python/requirements.txt
          echo "SPATIALMIFTOOLS_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - name: Check package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = "--no-manual",
            error_on = "warning",
            env = c("_R_CHECK_FORCE_SUGGESTS_" = "false")
          )
